<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelf To Tales — Project Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0d;
      --bg2: #111113;
      --bg3: #1a1a1e;
      --card: #161619;
      --accent: #4a9eff;
      --accent-glow: rgba(74, 158, 255, 0.15);
      --text: #e8e8e8;
      --muted: #7a7a85;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(74, 158, 255, 0.3);
      --font-head: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Outfit', sans-serif;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 2rem;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .title {
      font-family: var(--font-head);
      font-size: 2.2rem;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .btn-outline {
      padding: 0.6rem 1.4rem;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      cursor: pointer;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 class="title">Shelf To Tales</h1>
        <p class="subtitle">Project Details & Demonstration</p>
      </div>
      <a href="index.html" class="btn-outline">
        <i class="fi fi-rr-arrow-left"></i> Back to Portfolio
      </a>
    </div>

    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/criHrG6Ry7o?autoplay=1" title="Shelf To Tales Project Details" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>
</body>

</html>
